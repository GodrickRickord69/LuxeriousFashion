<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE BRAND OF LUXERIOUS FASHION</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top">
        <div class="header">
            <div class="logoandsearch">
                <div class="logo"><img src="/Logo.svg" alt="logo"></div>
                <div class="search"><img src="/search.svg" alt="search"></div>
            </div>
            <div class="menu">
                <div class="extendet_main"><img src="/extendetMain.svg" alt="ex.main"></div>
                <div class="personal_account"><img src="/personal_account.svg" alt="account"></div>
                <div class="cart"><img src="/cart.svg" alt="cart"></div>
            </div>
        </div>
        <div class="banner">
            <div class="photo_men"><img src="/photo_men.png" alt="men"></div>
            <div class="brand">
                <div class="lien"></div>
                <p class="text_brand">THE BRAND
                    OF LUXERIOUS FASHION</p>
            </div>
        </div>
        <div class="offer">
            <div class="offer_box"></div>
            <div class="offer_box"></div>
            <div class="offer_box"></div>
            <div class="offer_box_long"></div>
        </div>
        <div class="products">
            <h1 class="products_heading"></h1>
            <p class="products_text"></p>
            <div class="products_box"><h1 class="products_box_heading"></h1><p class="roducts_box_text"></p><p class="price"></p></div>
            <div class="products_box"><h1 class="products_box_heading"></h1><p class="roducts_box_text"></p><p class="price"></p></div>
            <div class="products_box"><h1 class="products_box_heading"></h1><p class="roducts_box_text"></p><p class="price"></p></div>
            <div class="products_box"><h1 class="products_box_heading"></h1><p class="roducts_box_text"></p><p class="price"></p></div>
            <div class="products_box"><h1 class="products_box_heading"></h1><p class="roducts_box_text"></p><p class="price"></p></div>
            <div class="products_box"><h1 class="products_box_heading"></h1><p class="roducts_box_text"></p><p class="price"></p></div>
        </div>
    </div>
</body>
</html>
